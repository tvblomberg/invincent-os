# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/tvblomberg/invincent-os
name: invincent-os
description: Personal Fedora atomic image built on wayblue Hyprland.

# wayblue only supports the latest tag
base-image: ghcr.io/wayblueorg/hyprland
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into the image root

  - type: dnf
    repos:
      cleanup: true # don't ship the extra repo files in the image
      copr:
        - scottames/ghostty
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
    install:
      packages:
        # terminal and CLI
        - ghostty
        - zsh
        - neovim
        - bat
        - btop
        - fd-find
        - ripgrep
        - chezmoi  # dotfiles (github.com/tvblomberg/dotfiles)
        # desktop
        - swappy
        - gtk-murrine-engine
        # containers and VMs
        - podman-compose
        - libvirt
        - qemu-kvm
        - virt-manager
        # networking
        - tailscale
        # packaging tools
        - rpmrebuild

  - type: systemd
    system:
      enabled:
        - tailscaled.service
        - libvirtd.service
        - libvirtd.socket

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        # Flathub by default
        install:
          # browsers
          - app.zen_browser.zen
          - com.brave.Browser
          # development
          - com.visualstudio.code
          - com.getpostman.Postman
          - io.podman_desktop.PodmanDesktop
          - com.microsoft.AzureStorageExplorer
          # notes and passwords
          - md.obsidian.Obsidian
          - com.bitwarden.desktop
          # media
          - com.spotify.Client
          - org.videolan.VLC
          - org.gimp.GIMP
          - org.flameshot.Flameshot
          - com.github.wwmm.easyeffects
          # office
          - org.libreoffice.LibreOffice
          - org.gnome.FileRoller
          # 3D printing and electronics
          - com.bambulab.BambuStudio
          - com.ultimaker.cura
          - org.kicad.KiCad
          - org.openscad.OpenSCAD
          # system tools
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
          - io.github.v81d.Wattage
          - org.easycoding.TunedSwitcher
          - org.gnome.World.PikaBackup
          - org.kde.filelight
          - org.kde.isoimagewriter
          - com.gitlab.davem.ClamTk
          # other
          - com.moonlight_stream.Moonlight
          - com.usebottles.bottles
          - org.remmina.Remmina

  - type: signing # signing policy and key so ostree-image-signed rebases verify
